<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Rayong Trail · ใบประกาศ</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700;800&family=Geist+Mono:wght@400;500;600&family=Noto+Sans+Thai:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    @page { size: A4 portrait; margin: 0; }
    * { box-sizing: border-box; }
    html, body { margin: 0; padding: 0;
      font-family: 'Geist', 'Noto Sans Thai', ui-sans-serif, system-ui, sans-serif;
      background: #d8d2c2; color: #1f2a1c; }

    .toolbar { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); background: #1f4d39; color: #fff;
      display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
      font-size: 14px; }
    .toolbar button { padding: 8px 16px; background: #fff; color: #1f4d39;
      border: none; border-radius: 4px; font-weight: 600; cursor: pointer;
      font-family: inherit; font-size: 14px; }
    .toolbar button.alt { background: transparent; color: #fff;
      border: 1px solid rgba(255,255,255,0.4); }
    .stage { padding: 24px; display: flex; justify-content: center; overflow-x: hidden; }

    /* 210mm × 262.5mm = a 4:5 ratio — Instagram's recommended portrait post
       size (and works fine for Facebook too), instead of A4's taller 210:297
       (≈ 0.707) — the whole page is one full-bleed finisher photo
       (Strava/race-photo-timing style) instead of a bordered certificate
       with a logo header and signature footer. */
    .cert {
      width: 210mm; height: 262.5mm;
      position: relative; overflow: hidden;
      page-break-after: always;
      box-shadow: 0 10px 30px rgba(0,0,0,0.18);
      color: #fff;
      /* fallback gradient + SVG mountain if no photo has been attached */
      background:
        url('assets/certificate-bg.jpg') center/cover no-repeat,
        linear-gradient(180deg, #4a7c5e 0%, #2d6a4f 45%, #1f4d39 100%);
    }
    .cert::before {
      /* default mountain silhouette behind any uploaded photo; hidden
         under the photo once one loads (no-op visually). */
      content: ''; position: absolute; left: 0; right: 0; bottom: 0;
      height: 55%; z-index: 0;
      background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 1200 400' preserveAspectRatio='none'><path d='M0 400 L0 280 L120 220 L210 260 L330 180 L420 240 L520 150 L640 200 L760 130 L880 200 L1000 170 L1100 240 L1200 200 L1200 400 Z' fill='%231a3d2f' opacity='0.55'/><path d='M0 400 L0 320 L160 290 L290 320 L410 270 L540 300 L680 260 L820 290 L960 250 L1080 290 L1200 270 L1200 400 Z' fill='%23163528' opacity='0.7'/></svg>") center bottom / 100% 100% no-repeat;
    }
    /* Bottom-fade so the overlaid bib/name/stats are always readable
       regardless of what's in the photo behind them. */
    .cert::after {
      content: ''; position: absolute; inset: 0;
      background: linear-gradient(180deg,
        rgba(0,0,0,0) 0%, rgba(0,0,0,0) 30%,
        rgba(0,0,0,0.1) 46%,
        rgba(0,0,0,0.55) 70%, rgba(0,0,0,0.82) 100%);
      pointer-events: none; z-index: 1;
    }

    /* Top-right event label + logo — its own dark pill background (instead
       of just a text-shadow) so it stays legible no matter how bright the
       photo behind it is; the bottom-fade (.cert::after) doesn't reach
       this far up the page. */
    .event-kicker-wrap {
      position: absolute; top: 10mm; right: 10mm; z-index: 3;
      display: flex; align-items: center; gap: 8px;
      max-width: 72%;
      background: rgba(0,0,0,0.4); backdrop-filter: blur(6px);
      padding: 6px 14px 6px 8px; border-radius: 999px;
    }
    .event-kicker-wrap img { width: 26px; height: 26px; flex-shrink: 0; }
    .event-kicker {
      font-family: 'Geist Mono',monospace; font-size: 10.5pt; font-weight: 600;
      letter-spacing: 0.08em; text-transform: uppercase;
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }

    /* Elevation profile, drawn directly on the photo like a watermark
       (Suunto/Strava activity-share style) instead of a boxed chart with
       its own background — see buildElevationChart below. A soft dark
       scrim behind it (not just relying on opacity/text-shadow on the line
       itself) keeps it visible even over a bright/overexposed part of the
       photo, which plain white-on-photo wasn't guaranteed to survive. */
    .elev-watermark {
      position: relative; z-index: 2;
      margin-bottom: 6mm; padding: 6mm 2mm 1mm;
      border-radius: 8px;
      background: linear-gradient(180deg, rgba(0,0,0,0) 0%, rgba(0,0,0,0.28) 100%);
      display: none; /* shown via JS once a course is actually found */
    }
    .elev-watermark svg { display: block; width: 100%; height: auto;
      filter: drop-shadow(0 1px 3px rgba(0,0,0,0.6)); }
    .elev-watermark .elev-stats {
      display: flex; gap: 14mm; margin-top: 2mm;
    }
    .elev-watermark .elev-stat b {
      font-family: 'Geist',sans-serif; font-size: 15pt; font-weight: 800;
      font-variant-numeric: tabular-nums;
    }
    .elev-watermark .elev-stat span {
      font-family: 'Geist Mono',monospace; font-size: 9pt; opacity: 0.85;
      margin-left: 2px;
    }
    .elev-watermark .elev-stat .lbl {
      font-family: 'Geist Mono',monospace; font-size: 7.5pt;
      letter-spacing: 0.16em; text-transform: uppercase; opacity: 0.75;
      margin-top: 1mm;
    }

    /* Bottom block: bib + name + two stat rows, anchored to the bottom of
       the page and always sitting above the elevation watermark. */
    .bottom-block {
      position: absolute; left: 0; right: 0; bottom: 0; z-index: 2;
      padding: 0 14mm 14mm;
    }
    .bib {
      font-family: 'Geist',sans-serif; font-weight: 800;
      font-size: 56pt; line-height: 1; letter-spacing: -0.01em;
      text-shadow: 0 2px 14px rgba(0,0,0,0.5);
    }
    .runner-name {
      font-family: 'Geist','Noto Sans Thai',sans-serif; font-weight: 800;
      text-transform: uppercase;
      font-size: 19pt; line-height: 1.15; letter-spacing: 0.01em;
      margin-top: 2mm;
      text-shadow: 0 1px 8px rgba(0,0,0,0.45);
    }
    .stats-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr;
      gap: 4mm; margin-top: 6mm; padding-top: 5mm;
      border-top: 1px solid rgba(255,255,255,0.4);
    }
    .stat-label {
      font-family: 'Geist Mono',monospace;
      font-size: 8pt; letter-spacing: 0.14em;
      opacity: 0.8; text-transform: uppercase;
    }
    .stat-value {
      font-family: 'Geist',sans-serif; font-weight: 700;
      font-size: 14pt; margin-top: 1.5mm;
      font-variant-numeric: tabular-nums;
      text-shadow: 0 1px 6px rgba(0,0,0,0.35);
    }

    @media print {
      body { background: #fff; }
      .toolbar, .stage { padding: 0 !important; background: #fff; }
      .cert { box-shadow: none; }
      .no-print { display: none !important; }
      * { -webkit-print-color-adjust: exact !important;
          print-color-adjust: exact !important; }
    }
    .trt-nav { display: flex; gap: 6px; align-items: center; padding: 10px 20px; background: #fff;
      border-bottom: 1px solid #e5e0d3; font-family: 'Geist Mono', ui-monospace, monospace; font-size: 11px; }
    .trt-nav a { color: #5d6b59; text-decoration: none; padding: 6px 10px; border-radius: 6px; }
    .trt-nav a.active { color: #fff; background: #2d6a4f; }
    .trt-nav a:hover:not(.active) { background: #f5f1e8; color: #1f4d39; }
  </style>
</head>
<body>
  <nav class="trt-nav no-print">
    <a href="/">📱 App</a>
    <a href="/monitor.html">🖥 Live Monitor</a>
    <a href="/results/">📊 Results</a>
    <a href="/admin/">🔧 Admin</a>
  </nav>
  <script>if (window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform()) document.currentScript.previousElementSibling.style.display = "none";</script>
  <!-- Loaded so a certificate can be opened via ?event=<id>&bib=<bib> (e.g.
       linked from the Results page) and built from the synced roster —
       not just from this device's own localStorage, which only ever had
       data for whoever actually finished on this exact browser/app. -->
  <script src="/src/firebase-config.js"></script>
  <script type="module" src="/src/firebase.js"></script>
  <script src="/src/event-status.js"></script>
  <script src="/src/event-store.js"></script>
  <script src="/src/runner-store.js"></script>
  <script src="/src/course-geo.js"></script>
  <!-- Renders the .cert card to an actual PNG for saveCertImage() below —
       this card is now meant primarily for sharing on Facebook/Instagram
       (see the 4:5 sizing), and "print to PDF then convert to an image" was
       too many steps for that. No bundler here, so pulled from CDN like
       every other third-party lib this project already uses (React,
       Leaflet, jsQR, ...). -->
  <script src="https://unpkg.com/html2canvas@1.4.1/dist/html2canvas.min.js"></script>

  <div class="stage">
    <div class="cert">
      <!-- -webkit-touch-callout:none blocks iOS's native long-press "Save
           Image"/"Copy" context menu on this <img> — a runner reported the
           whole app crashing when long-pressing the attached photo to save
           it that way. That native save path goes straight through WebKit
           on the full base64 data URL this <img> holds, outside anything
           this page's own JS controls, so it can't be fixed/debugged from
           here the way the earlier resize fix could. The page already has
           an intended, working way to save/share this exact photo (the
           "💾 บันทึกรูปภาพ" button above, canvas-rendered PNG download) — so
           the long-press gesture is just redundant as well as crash-prone,
           safe to disable outright rather than try to patch. -->
      <img id="user-photo" alt="" style="display:none;position:absolute;inset:0;width:100%;height:100%;object-fit:cover;z-index:0;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none;">
      <div class="event-kicker-wrap">
        <img src="/assets/rayong-trail-icon.png" alt=""/>
        <span class="event-kicker" id="event-kicker">RAYONG TRAIL · 2026</span>
      </div>

      <div class="bottom-block">
        <!-- Elevation profile — filled in + shown by JS once a course is
             actually found for this event/distance. -->
        <div class="elev-watermark" id="elev-watermark">
          <svg id="elevation-svg" viewBox="0 0 760 130" preserveAspectRatio="none"></svg>
          <div class="elev-stats">
            <div class="elev-stat"><b id="elev-dist">—</b><span>km</span><div class="lbl">Distance</div></div>
            <div class="elev-stat"><b id="elev-gain">—</b><span>m</span><div class="lbl">Elevation Gain</div></div>
          </div>
        </div>

        <div class="bib" id="bib">—</div>
        <div class="runner-name" id="name">—</div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-label">Gun</div>
            <div class="stat-value" id="s-gun">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Chip</div>
            <div class="stat-value" id="s-chip">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Pace</div>
            <div class="stat-value" id="s-pace">—</div>
          </div>
        </div>
        <div class="stats-row">
          <div class="stat">
            <div class="stat-label">Overall</div>
            <div class="stat-value" id="s-overall">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Gender</div>
            <div class="stat-value" id="s-gender">—</div>
          </div>
          <div class="stat">
            <div class="stat-label">Nation</div>
            <div class="stat-value" id="s-nation">THA</div>
          </div>
        </div>
      </div>
    </div>
  </div>

  <!-- Was a top toolbar, one row above the photo — on a real phone that
       sat right under the notch/Dynamic Island/status bar, so "บันทึกรูปภาพ"
       in particular got physically covered and couldn't be tapped at all.
       Moved below the photo instead (a normal, always-reachable spot on a
       tall page you scroll down through) — same buttons, same behavior,
       just relocated. -->
  <div class="toolbar no-print">
    <span>📜 ใบประกาศ</span>
    <button onclick="saveCertImage()">💾 บันทึกรูปภาพ</button>
    <button class="alt" onclick="window.print()">🖨 Print / Save as PDF</button>
    <input type="file" accept="image/*" id="photo-input" style="display:none;">
    <button id="photo-btn" onclick="document.getElementById('photo-input').click()">📷 แนบรูป</button>
    <button class="alt" id="photo-remove-btn" onclick="removePhoto()" style="display:none;">✕ ลบรูป</button>
    <button class="alt" onclick="window.history.back()">← กลับ</button>
  </div>

  <script>
    const STORAGE_KEY = 'trt.finish.result';

    function fmtElapsed(ms) {
      if (ms == null || ms < 0 || !isFinite(ms)) return '—';
      const s = Math.floor(ms / 1000);
      const h = Math.floor(s / 3600);
      const m = Math.floor((s % 3600) / 60);
      const r = s % 60;
      return String(h).padStart(2,'0') + ':' + String(m).padStart(2,'0') + ':' + String(r).padStart(2,'0');
    }
    // "5:26"-style pace (no leading zero on minutes, no quote marks) —
    // matches the plain mm:ss look of the reference layout, as opposed to
    // the 7'46" mark used elsewhere in the app.
    function fmtPace(ms, km) {
      if (!ms || !km) return '—';
      const min = ms / 60000 / km;
      const mm = Math.floor(min);
      const ss = Math.round((min - mm) * 60);
      return `${mm}:${String(ss).padStart(2,'0')}`;
    }
    function genderLabel(g) {
      return g === 'f' ? 'Female' : g === 'm' ? 'Male' : '—';
    }
    function set(id, v) { const el = document.getElementById(id); if (el) el.textContent = v; }

    function render(data) {
      if (!data || !data.runner) {
        set('name', 'ยังไม่มีข้อมูลการเข้าเส้นชัย');
        set('event-kicker', 'เปิดหน้านี้ผ่านปุ่ม "บันทึกใบประกาศ" หลังเข้าเส้นชัย');
        return;
      }
      const r = data.runner;
      const distKm = parseFloat(r.distance_current) || data.distance_km || 0;
      set('bib', r.bib ? '#' + r.bib : '—');
      set('name', r.name || '—');
      set('s-gun', fmtElapsed(data.gun_time_ms));
      set('s-chip', fmtElapsed(data.chip_time_ms));
      set('s-pace', fmtPace(data.chip_time_ms, distKm));
      set('s-overall', data.rank ? '#' + data.rank : '—');
      set('s-gender', genderLabel(r.gender));
      set('event-kicker', (data.event_name || 'RAYONG TRAIL') + ' · ' + (r.distance_current || '') + (data.race_year ? (' · ' + data.race_year) : ''));
      buildElevationChart(data.event_id, r.distance_current);
      // The attached-photo key depends on *whose* certificate this is —
      // see loadPhotoForCurrentRunner below for why. Only knowable once
      // data has actually loaded, so the initial photo load has to happen
      // here instead of unconditionally at script startup.
      loadPhotoForCurrentRunner(data.event_id || qEventId, r.bib);
    }

    // Draws the same elevation profile the app's Route tab shows, rendered
    // translucent directly over the photo (a watermark, not a boxed chart)
    // — needs the event's own id (see mobile-app.jsx's saveCertificateResult
    // / this file's buildDataFromRoster) to look up its GPX-derived course
    // via window.courseGeo; silently stays hidden instead of showing a
    // broken/empty chart if either is missing (e.g. an old finish result
    // saved before event_id was added).
    async function buildElevationChart(eventId, distLabel) {
      const wrap = document.getElementById('elev-watermark');
      const svg = document.getElementById('elevation-svg');
      if (!eventId || !distLabel || !window.courseGeo || !window.eventStore) { wrap.style.display = 'none'; return; }
      try {
        const ev = (window.eventStore.loadEvents() || []).find(e => e.id === eventId);
        if (!ev) { wrap.style.display = 'none'; return; }
        const course = await window.courseGeo.courseJsonForDistance(ev, distLabel);
        if (!course || !course.points || !course.points.length || !course.totalKm) { wrap.style.display = 'none'; return; }
        drawElevationSvg(svg, course);
        const gain = window.courseGeo.cumulativeGainToKm(course.points.map(p => ({ lat: p[0], lon: p[1], ele: p[2], km: p[3] })), course.totalKm);
        set('elev-dist', course.totalKm.toFixed(1));
        set('elev-gain', '+' + gain);
        wrap.style.display = 'block';
        fitCertToScreen(); // the chart just added real height — refit
      } catch (err) {
        console.warn('[trt] certificate elevation chart failed', err);
        wrap.style.display = 'none';
      }
    }

    // Plain white silhouette line + fill — a watermark sitting on the
    // photo, not a boxed chart with its own axis labels/checkpoints (that
    // version already exists in the app's own Route tab).
    function drawElevationSvg(svg, course) {
      const W = 760, H = 130, padL = 4, padR = 4, padT = 6, padB = 6;
      const totalKm = course.totalKm;
      const minEle = course.minEle, maxEle = course.maxEle;
      const eleRange = Math.max(1, maxEle - minEle);
      const x = km => padL + (km / totalKm) * (W - padL - padR);
      const y = ele => padT + (1 - (ele - minEle) / eleRange) * (H - padT - padB);
      const baseline = H - padB;
      let line = '';
      course.points.forEach((p, i) => { line += `${i === 0 ? 'M' : 'L'}${x(p[3]).toFixed(1)},${y(p[2]).toFixed(1)} `; });
      line = line.trim();
      const area = `${line} L${x(totalKm).toFixed(1)},${baseline} L${x(0).toFixed(1)},${baseline} Z`;
      svg.innerHTML = `
        <path d="${area}" fill="#fff" fill-opacity="0.3"/>
        <path d="${line}" fill="none" stroke="#fff" stroke-width="3.5"/>
      `;
    }

    // Opened with ?event=<id>&bib=<bib> (e.g. from a "🏅 ใบประกาศ" link on
    // the Results page) — build the certificate straight from the synced
    // roster instead of this device's own localStorage, so it works from
    // any device, not just whichever one the runner actually finished on.
    // Gun time = elapsed since the event's official start; Chip time =
    // elapsed since this runner's own start scan — same distinction the
    // app's own Track tab shows (see mobile-app.jsx's TrackTab).
    function buildDataFromRoster(eventId, bib) {
      if (!window.eventStore || !window.runnerStore || !window.eventStatus) return null;
      const ev = (window.eventStore.loadEvents() || []).find(e => e.id === eventId);
      const runners = window.runnerStore.listRunners(eventId) || [];
      const r = runners.find(x => x.bib === bib);
      if (!ev || !r) return null;
      const combine = window.eventStatus.combineDateTime;
      function checkinMs(hhmm) { const d = combine(ev.raceDateISO, hhmm); return d ? d.getTime() : null; }
      const startCk = (r.checkins || []).find(c => c.cp === 'start');
      const finishCk = (r.checkins || []).find(c => c.cp === 'finish');
      if (!finishCk) return null;
      const finishMs = checkinMs(finishCk.t);
      const chipStartMs = startCk ? checkinMs(startCk.t) : null;
      const distDef = (ev.distances || []).find(d => d.label === r.distance);
      const gunMs = distDef && distDef.cpTimes ? checkinMs(distDef.cpTimes.start) : null;
      const gunTimeMs = (gunMs != null && finishMs != null) ? finishMs - gunMs : null;
      const chipTimeMs = (chipStartMs != null && finishMs != null) ? finishMs - chipStartMs : null;
      const finishers = runners
        .filter(x => x.distance === r.distance && !x.dnf && (x.checkins || []).some(c => c.cp === 'finish'))
        .map(x => ({ bib: x.bib, finishMs: checkinMs((x.checkins.find(c => c.cp === 'finish') || {}).t) }))
        .sort((a, b) => (a.finishMs || 0) - (b.finishMs || 0));
      const rankIdx = finishers.findIndex(x => x.bib === bib);
      return {
        runner: { name: r.nickname, distance_current: r.distance, distance_original: r.distance, bib: r.bib, gender: r.gender || '' },
        gun_time_ms: gunTimeMs,
        chip_time_ms: chipTimeMs,
        rank: rankIdx >= 0 ? rankIdx + 1 : null,
        finish_at: finishMs,
        distance_km: parseFloat(r.distance) || 0,
        event_id: eventId,
        event_name: ev.name,
        race_year: ev.raceDateISO ? ev.raceDateISO.slice(0, 4) : '',
      };
    }

    const qs = new URLSearchParams(window.location.search);
    const qEventId = qs.get('event');
    const qBib = qs.get('bib');

    function loadAndRender() {
      try {
        if (qEventId && qBib) {
          const fromRoster = buildDataFromRoster(qEventId, qBib);
          if (fromRoster) { render(fromRoster); return; }
        }
        const raw = localStorage.getItem(STORAGE_KEY);
        render(raw ? JSON.parse(raw) : null);
      } catch (e) { console.error('[trt] cert load error', e); }
    }
    loadAndRender();
    // Roster sync from Firestore is asynchronous — a fresh device/browser
    // that's never seen this event's runners before won't have anything to
    // build from on the first attempt. Re-render once real data lands.
    if (qEventId && qBib) window.addEventListener('trt:runners-updated', loadAndRender);

    // Optional runner photo (e.g. a finish-line selfie) to show instead of
    // the default mountain silhouette background — stored as a data URL in
    // localStorage so it survives reopening this page, same pattern as the
    // finish result itself. Keyed per event+bib (not one shared key) — this
    // page is also opened via ?event=&bib= to view *someone else's*
    // certificate (from Results/Ranking), and a single shared key meant
    // whichever photo this device had attached most recently — even for a
    // completely different runner — showed up automatically on every
    // certificate viewed afterward, looking like it had been "auto-attached"
    // to a stranger's result.
    let currentPhotoKey = null;
    const photoImg = document.getElementById('user-photo');
    const photoBtn = document.getElementById('photo-btn');
    const removeBtn = document.getElementById('photo-remove-btn');
    function applyPhoto(dataUrl) {
      if (dataUrl) {
        photoImg.src = dataUrl;
        photoImg.style.display = 'block';
        photoBtn.textContent = '🔄 เปลี่ยนรูป';
        removeBtn.style.display = '';
      } else {
        photoImg.style.display = 'none';
        photoImg.removeAttribute('src');
        photoBtn.textContent = '📷 แนบรูป';
        removeBtn.style.display = 'none';
      }
    }
    function loadPhotoForCurrentRunner(eventId, bib) {
      currentPhotoKey = 'trt.cert.photo.' + (eventId || '') + '_' + (bib || '');
      try { applyPhoto(localStorage.getItem(currentPhotoKey)); } catch (e) { applyPhoto(null); }
    }
    function removePhoto() {
      if (currentPhotoKey) { try { localStorage.removeItem(currentPhotoKey); } catch (e) {} }
      applyPhoto(null);
    }
    // A raw camera photo used straight off the file input — no resizing —
    // used to get loaded into <img> and localStorage at full original size
    // (a modern phone photo easily runs 4-12MB before even base64-inflating
    // ~33% on top of that). Decoding that into a full-resolution bitmap
    // inside a Capacitor WKWebView pushed memory high enough that iOS
    // killed the whole app outright ("ปิดตัวลงโดยไม่ทราบสาเหตุ") — this
    // page is the finish line, the worst possible moment for that to
    // happen. Downscaling through a canvas first (long edge capped, then
    // re-encoded as a modest-quality JPEG) cuts a several-MB original down
    // to a few hundred KB before it's ever decoded to display size or
    // written to localStorage, fixing both the memory spike and (since
    // localStorage has its own multi-MB-per-origin quota) the silent
    // "photo doesn't actually save" failure a too-large original could
    // also cause.
    const PHOTO_MAX_DIM = 1600;
    const PHOTO_QUALITY = 0.85;
    function resizePhoto(file) {
      return new Promise((resolve, reject) => {
        const img = new Image();
        const objectUrl = URL.createObjectURL(file);
        img.onload = () => {
          URL.revokeObjectURL(objectUrl);
          const scale = Math.min(1, PHOTO_MAX_DIM / Math.max(img.naturalWidth, img.naturalHeight));
          const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          canvas.getContext('2d').drawImage(img, 0, 0, w, h);
          resolve(canvas.toDataURL('image/jpeg', PHOTO_QUALITY));
        };
        img.onerror = () => { URL.revokeObjectURL(objectUrl); reject(new Error('image decode failed')); };
        img.src = objectUrl;
      });
    }
    document.getElementById('photo-input').addEventListener('change', async (e) => {
      const file = e.target.files && e.target.files[0];
      if (!file || !currentPhotoKey) return;
      try {
        const dataUrl = await resizePhoto(file);
        try { localStorage.setItem(currentPhotoKey, dataUrl); } catch (err) { console.warn('[trt] photo save failed', err); }
        applyPhoto(dataUrl);
      } catch (err) {
        console.warn('[trt] photo resize failed', err);
      }
    });

    // Renders the card to a real PNG and downloads it — the button most
    // people actually want (share to Facebook/Instagram), since going
    // through Print/Save-as-PDF and then converting that to an image was
    // an unreasonable number of steps for what's now primarily a
    // shareable photo card, not a document to file away.
    async function saveCertImage() {
      const cert = document.querySelector('.cert');
      if (!cert) return;
      if (!window.html2canvas) { alert('โหลดตัวช่วยบันทึกรูปไม่สำเร็จ ลองเช็คอินเทอร์เน็ตแล้วรีเฟรชหน้านี้ใหม่ครับ'); return; }
      // Capture at the card's real, unscaled size (not whatever
      // fitCertToScreen shrank it to for on-screen display) — otherwise a
      // phone screen would produce a blurry, low-resolution PNG.
      const prevTransform = cert.style.transform;
      cert.style.transform = 'none';
      try {
        const canvas = await html2canvas(cert, { useCORS: true, scale: 2, backgroundColor: '#1f4d39' });
        // A synthetic <a download> click is the standard web way to save a
        // generated file, and still works fine in a real browser tab — but
        // inside the app's own Capacitor/WKWebView shell there's no
        // Downloads folder for it to land in, so the click just silently
        // did nothing at all (no error, nothing to see — this is exactly
        // what a runner reported as "กดบันทึกภาพแล้วไม่มีอะไรเกิดขึ้นเลย").
        // navigator.share with an actual File is a standard Web API WebKit
        // already supports inside WKWebView without needing a new native
        // Capacitor plugin/rebuild — it opens iOS's real share sheet, and
        // "Save Image" from there writes to Photos properly (through
        // WebKit's own supported share flow, not the crash-prone raw
        // long-press-on-<img> path this page disables above). Falls back
        // to the old <a download> for a real desktop/mobile browser tab,
        // where Web Share's file support may not exist but downloads work
        // fine directly.
        const blob = await new Promise(resolve => canvas.toBlob(resolve, 'image/png'));
        const file = blob && new File([blob], 'rayong-trail-certificate.png', { type: 'image/png' });
        if (file && navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: 'Rayong Trail Finisher' });
            return;
          } catch (shareErr) {
            if (shareErr && shareErr.name === 'AbortError') return; // user closed the share sheet — not a failure
            console.warn('[trt] share failed, falling back to direct download', shareErr);
          }
        }
        const link = document.createElement('a');
        link.download = 'rayong-trail-certificate.png';
        link.href = canvas.toDataURL('image/png');
        link.click();
      } catch (err) {
        console.warn('[trt] save image failed', err);
        alert('บันทึกรูปไม่สำเร็จ ลองใช้ปุ่ม Print / Save as PDF แทนได้ครับ');
      } finally {
        cert.style.transform = prevTransform;
        fitCertToScreen();
      }
    }

    // .cert is sized in real physical units (mm/pt) for print — correct for
    // an actual A4 printout, but on a phone screen (the far more common way
    // this page actually gets opened — the "บันทึกใบประกาศ" flow, TestFlight,
    // etc.) those units render at their true physical size regardless of
    // the tiny viewport, and nothing was scaling the card down to fit.
    // Text that was sized to comfortably fit an A4-width photo ended up
    // fighting for space in a viewport a fraction as wide, which is what
    // actually produced the cramped, overlapping look — not a layout bug
    // in the card itself. Scaling the whole card down as one rigid unit
    // (instead of trying to redo the sizing in relative units) guarantees
    // the on-screen look always matches the print-tested layout exactly,
    // just smaller — nothing can overlap on screen that doesn't already
    // overlap on the printed page.
    function fitCertToScreen() {
      const cert = document.querySelector('.cert');
      const stage = document.querySelector('.stage');
      if (!cert || !stage) return;
      cert.style.transform = 'none';
      const naturalWidth = cert.offsetWidth;
      const naturalHeight = cert.offsetHeight;
      const available = stage.clientWidth;
      if (!naturalWidth || !naturalHeight || naturalWidth <= available) { stage.style.height = ''; return; }
      const scale = available / naturalWidth;
      cert.style.transformOrigin = 'top center';
      cert.style.transform = `scale(${scale})`;
      // Scaling down leaves the natural (unscaled) height reserved in
      // normal flow otherwise — a tall blank gap below the now-smaller
      // card. Explicitly shrinking .stage's height to match closes it.
      stage.style.height = (naturalHeight * scale) + 'px';
    }
    window.addEventListener('resize', fitCertToScreen);
    window.addEventListener('orientationchange', fitCertToScreen);
    window.addEventListener('load', fitCertToScreen);
    fitCertToScreen();
    // Printing must use the real, untransformed physical size — a phone
    // can still trigger window.print() (Print/Save as PDF), so the scale
    // has to come off first and go back on after.
    window.addEventListener('beforeprint', () => { const c = document.querySelector('.cert'); if (c) c.style.transform = 'none'; });
    window.addEventListener('afterprint', fitCertToScreen);
  </script>
</body>
</html>
